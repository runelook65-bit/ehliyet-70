<!doctype html><html><head><meta name="theme-color" content="#ffffff"><meta name="description" content="Ehliyet 70 — sürücü adayları için test, tekrar ve sınav hazırlığı."><link rel="manifest" href="./manifest.webmanifest"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ehliyet 70</title>
<link rel="apple-touch-icon" sizes="180x180" href="./assets/icon.svg">
<link rel="icon" type="image/png" sizes="48x48" href="./assets/icon.svg">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Düzen: tek sütun, yüzen cam sekme çubuğu, kadran merkezli ana ekran. Dil: araç gösterge paneli. Gradyan kenarlı cam kartlar, ışıklı yay, 70 puan geçme eşiği. */
:root{
  --bg:#06080D; --card:#0E1420; --card2:#131B2A; --surface:#0E1420; --surface2:#172030; --raise:#1F2B40;
  --fg:#F1F4FA; --muted:#93A1B8; --dim:#56637A; --line:rgba(160,185,230,.12); --hi:rgba(255,255,255,.06);
  --edge1:rgba(255,255,255,.17); --edge2:rgba(255,255,255,.035);
  --accent:#7CAEFF; --accent-ink:#071225; --accent-soft:rgba(124,174,255,.15); --glow:rgba(79,134,255,.30);
  --g1:#4F86FF; --g2:#6FE3FF; --btn1:#4F86FF; --btn2:#3560E8;
  --orb1:rgba(79,134,255,.34); --orb2:rgba(111,227,255,.12); --face1:#19253C; --face2:#0A101B;
  --ok:#43D99A; --ok-soft:rgba(67,217,154,.13); --bad:#FF7B72; --bad-soft:rgba(255,123,114,.13); --warn:#FFBE55;
  --track:#1B2536; --glass:rgba(16,22,34,.72); --shadow:0 14px 34px rgba(0,0,0,.45);
  --c-trafik:#7CAEFF; --cs-trafik:rgba(124,174,255,.17);
  --c-ilkyardim:#3FD9A0; --cs-ilkyardim:rgba(63,217,160,.15);
  --c-motor:#FFBE55; --cs-motor:rgba(255,190,85,.15);
  --c-adap:#B79BFF; --cs-adap:rgba(183,155,255,.16);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --text:"Figtree",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EAEEF5; --card:#FFFFFF; --card2:#F4F7FB; --surface:#FFFFFF; --surface2:#EEF2F8; --raise:#E2E8F1;
    --fg:#0C1424; --muted:#556077; --dim:#8A95A9; --line:rgba(20,40,80,.10); --hi:rgba(255,255,255,.9);
    --edge1:rgba(20,40,90,.17); --edge2:rgba(20,40,90,.04);
    --accent:#1F5BE0; --accent-ink:#FFFFFF; --accent-soft:rgba(31,91,224,.09); --glow:rgba(50,100,240,.24);
    --g1:#2C6BFF; --g2:#2FB7F0; --btn1:#3A78FF; --btn2:#1F4FD6;
    --orb1:rgba(60,110,255,.22); --orb2:rgba(47,183,240,.16); --face1:#FFFFFF; --face2:#E3EAF4;
    --ok:#0F8F5B; --ok-soft:rgba(15,143,91,.10); --bad:#D03A33; --bad-soft:rgba(208,58,51,.09); --warn:#B36B00;
    --track:#DCE3EC; --glass:rgba(255,255,255,.78); --shadow:0 1px 2px rgba(15,30,60,.06),0 14px 32px rgba(15,30,60,.09);
    --c-trafik:#2563EB; --cs-trafik:rgba(37,99,235,.10);
    --c-ilkyardim:#0E9F6E; --cs-ilkyardim:rgba(14,159,110,.10);
    --c-motor:#C77700; --cs-motor:rgba(199,119,0,.11);
    --c-adap:#7C5CE0; --cs-adap:rgba(124,92,224,.10);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EAEEF5; --card:#FFFFFF; --card2:#F4F7FB; --surface:#FFFFFF; --surface2:#EEF2F8; --raise:#E2E8F1;
    --fg:#0C1424; --muted:#556077; --dim:#8A95A9; --line:rgba(20,40,80,.10); --hi:rgba(255,255,255,.9);
    --edge1:rgba(20,40,90,.17); --edge2:rgba(20,40,90,.04);
    --accent:#1F5BE0; --accent-ink:#FFFFFF; --accent-soft:rgba(31,91,224,.09); --glow:rgba(50,100,240,.24);
    --g1:#2C6BFF; --g2:#2FB7F0; --btn1:#3A78FF; --btn2:#1F4FD6;
    --orb1:rgba(60,110,255,.22); --orb2:rgba(47,183,240,.16); --face1:#FFFFFF; --face2:#E3EAF4;
    --ok:#0F8F5B; --ok-soft:rgba(15,143,91,.10); --bad:#D03A33; --bad-soft:rgba(208,58,51,.09); --warn:#B36B00;
    --track:#DCE3EC; --glass:rgba(255,255,255,.78); --shadow:0 1px 2px rgba(15,30,60,.06),0 14px 32px rgba(15,30,60,.09);
    --c-trafik:#2563EB; --cs-trafik:rgba(37,99,235,.10);
    --c-ilkyardim:#0E9F6E; --cs-ilkyardim:rgba(14,159,110,.10);
    --c-motor:#C77700; --cs-motor:rgba(199,119,0,.11);
    --c-adap:#7C5CE0; --cs-adap:rgba(124,92,224,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:radial-gradient(80% 380px at 15% -70px,var(--orb1),transparent 70%) no-repeat,radial-gradient(70% 320px at 95% -50px,var(--orb2),transparent 70%) no-repeat,var(--bg);color:var(--fg);
  font-family:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ul{margin:0;padding:0}
ul{list-style:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,.field:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 130px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.view{display:flex;flex-direction:column;gap:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:14px}
.grow{flex:1;min-width:0}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.035em;text-wrap:balance}
.h2{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.2;letter-spacing:-.02em}

/* cam kart: gradyan kenar */
.panel,.tile,.wide,.qcard{border:1px solid transparent;
  background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(160deg,var(--edge1),var(--edge2) 48%,var(--edge1) 140%) border-box;box-shadow:var(--shadow)}
.panel{border-radius:28px}
.panel.pad{padding:20px}
.view>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}.view>*:nth-child(5){animation-delay:.2s}
@keyframes rise{from{transform:translateY(12px);opacity:.3}to{transform:none;opacity:1}}

/* üst çubuk */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.02em;line-height:1.1}
.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,var(--btn1),var(--btn2));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.brand small{display:block;font-family:var(--text);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.streak{display:flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-weight:700;font-size:14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.streak .ico{width:17px;height:17px;color:var(--warn)}

/* ana kart ve kadran */
.hero{position:relative;overflow:hidden;isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(64px);z-index:-1;pointer-events:none}
.hero::before{width:280px;height:280px;background:var(--orb1);top:-110px;left:50%;transform:translateX(-50%)}
.hero::after{width:200px;height:200px;background:var(--orb2);bottom:-70px;right:-40px}
.roadbg{position:absolute;left:0;top:0;width:100%;height:170px;z-index:-1;pointer-events:none;-webkit-mask-image:linear-gradient(#000 25%,transparent);mask-image:linear-gradient(#000 25%,transparent)}
.gwrap{padding:24px 10px 0}
.gauge{display:block;width:min(100%,320px);margin:0 auto;overflow:visible}
.gauge .gv{font-family:var(--display);font-weight:800;font-size:42px;letter-spacing:-.04em;fill:var(--fg)}
.gauge .gl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;fill:var(--muted);font-weight:700}
.gauge .gt{font-size:10px;font-weight:700;fill:var(--dim)}
.gauge .g-arc{transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px var(--glow))}
.gauge .needle{transition:transform 1.2s cubic-bezier(.2,.8,.2,1);transform-origin:120px 118px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.gauge .tk{transition:stroke .3s}
.gcap{text-align:center;font-size:14px;color:var(--muted);padding:0 22px 18px;text-wrap:balance}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:linear-gradient(rgba(255,255,255,.02),transparent)}
.statrow>div{padding:15px 6px 14px;text-align:center}
.statrow>div+div{border-left:1px solid var(--line)}
.statrow b{display:block;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.statrow span{font-size:12.5px;color:var(--muted);display:block}
.mb{height:4px;width:56%;border-radius:2px;background:var(--track);margin:7px auto 0;overflow:hidden}
.mb i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--g1),var(--g2))}

/* düğmeler */
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:0 22px;border-radius:19px;width:100%;
  background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;font-weight:700;font-size:16.5px;letter-spacing:-.005em;
  box-shadow:0 14px 30px var(--glow),inset 0 1px 0 rgba(255,255,255,.38),inset 0 -2px 0 rgba(0,0,0,.14);transition:transform .15s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.26) 50%,transparent 62%);transform:translateX(-130%);animation:shine 6s ease-in-out 1.5s infinite}
@keyframes shine{0%,70%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost::after,.btn.small::after,.btn.danger::after{display:none}
.btn.small{min-height:46px;width:auto;padding:0 18px;font-size:14.5px;border-radius:15px;box-shadow:0 8px 20px var(--glow),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.small.ghost{box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:var(--bad);color:#fff;box-shadow:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.pill{display:inline-flex;align-items:center;padding:3px 11px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--surface2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* konu kartları */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:3px;min-height:170px;padding:16px;border-radius:24px;text-align:left;transition:transform .15s;
  background:radial-gradient(120% 90% at 100% 0%,var(--cs),transparent 62%) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(160deg,var(--edge1),var(--edge2) 48%,var(--edge1) 140%) border-box}
.tile:active{transform:scale(.98)}
.tile .tt{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:auto}
.tb{position:relative;width:56px;height:56px;flex:none;display:block}
.tb svg.rg{position:absolute;inset:0}
.tbi{position:absolute;left:7px;top:7px;width:42px;height:42px;border-radius:14px;background:var(--cs);color:var(--c);display:flex;align-items:center;justify-content:center}
.pc{font-size:12.5px;font-weight:700;color:var(--c);padding:4px 10px;border-radius:99px;background:var(--cs)}
.tn{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.2;letter-spacing:-.015em;margin-top:14px;text-wrap:balance}
.ts{font-size:13px;color:var(--muted)}
.bar{display:block;height:5px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--c,var(--accent))}
.wide{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:24px;
  background:radial-gradient(90% 140% at 100% 0%,var(--cs),transparent 60%) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(160deg,var(--edge1),var(--edge2) 48%,var(--edge1) 140%) border-box}
.wide:active{transform:scale(.99)}
.banner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:22px;background:var(--bad-soft);border:1px solid var(--line)}
.banner>.ico{color:var(--bad);width:26px;height:26px}

/* sınav ekranı */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats3 b{display:block;font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.1}
.stats3 span{font-size:13px;color:var(--muted)}
.dist{display:flex;gap:4px;height:12px}
.dist i{display:block;border-radius:4px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;font-size:13.5px}
.legend li{display:flex;align-items:center;gap:8px;color:var(--muted)}
.legend li i{width:9px;height:9px;border-radius:50%;flex:none}
.legend b{color:var(--fg);margin-left:auto;font-weight:600}
.ask{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}

/* yüzen sekme çubuğu */
.navwrap{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav{pointer-events:auto;max-width:420px;margin:0 auto;display:flex;justify-content:space-between;gap:2px;padding:6px;border-radius:28px;
  background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform:translateZ(0)}
.tab{display:flex;align-items:center;gap:6px;height:50px;padding:0 12px;border-radius:22px;color:var(--muted);font-weight:700;font-size:13.5px;transition:background .2s}
.tab span{display:none}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
.tab[aria-current="page"] span{display:inline}

/* test katmanı */
#quiz,#onb,#lb,#pay{position:fixed;inset:0;z-index:50;overflow-y:auto;background:radial-gradient(80% 380px at 15% -70px,var(--orb1),transparent 70%) no-repeat,radial-gradient(70% 320px at 95% -50px,var(--orb2),transparent 70%) no-repeat,var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#onb{z-index:60}
.q{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:18px;padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.qtop{display:flex;align-items:center;gap:12px}
.xbtn{width:46px;height:46px;border-radius:16px;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.qtitle{flex:1;min-width:0}
.qtitle b{display:block;font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.qtitle span{font-size:13px;color:var(--muted)}
.timer{font-family:var(--display);font-weight:700;font-size:19px;padding:8px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.segs{display:flex;gap:4px}
.segs i{flex:1;min-width:2px;height:5px;border-radius:3px;background:var(--track);transition:background .2s}
.segs i.cur{background:linear-gradient(90deg,var(--g1),var(--g2))}.segs i.ok{background:var(--ok)}.segs i.bad{background:var(--bad)}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.strip::-webkit-scrollbar{display:none}
.chip{flex:none;width:40px;height:40px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--muted)}
.chip.done{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.cur{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;border-color:transparent;box-shadow:0 6px 16px var(--glow)}
.qcard{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;padding:20px 20px 22px;border-radius:28px;
  background:radial-gradient(120% 90% at 100% 0%,var(--cs),transparent 60%) padding-box,linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(160deg,var(--edge1),var(--edge2) 48%,var(--edge1) 140%) border-box}
.qn{position:absolute;right:18px;top:8px;font-family:var(--display);font-weight:800;font-size:68px;letter-spacing:-.05em;line-height:1;color:var(--c);opacity:.14}
.cattag{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.cattag i{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.scene{margin:4px -4px 2px;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#161D2A;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.scene svg{display:block;width:100%;height:auto;aspect-ratio:240/150}
.qtext{font-family:var(--display);font-weight:700;font-size:23px;line-height:1.27;letter-spacing:-.025em;text-wrap:pretty;position:relative}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:15px;min-height:64px;border-radius:22px;background:var(--card);
  border:1.5px solid var(--line);box-shadow:inset 0 1px 0 var(--hi);transition:border-color .15s,background .15s,box-shadow .2s}
.opt:active{transform:scale(.99)}
.opt .L{width:36px;height:36px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--muted);flex:none}
.opt .t{flex:1;min-width:0;font-weight:500;line-height:1.4}
.opt .r{display:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 10px 26px var(--glow)}
.opt.sel .L{background:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}.opt.ok .L{background:var(--ok);color:var(--bg)}.opt.ok .r{display:block;color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}.opt.bad .L{background:var(--bad);color:var(--bg)}.opt.bad .r{display:block;color:var(--bad)}
.opt[disabled]{cursor:default}
.qfoot{position:sticky;bottom:0;margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:14px 0 calc(env(safe-area-inset-bottom,0px) + 14px);
  background:linear-gradient(to top,var(--bg) 72%,transparent)}
.qfoot .two{display:flex;gap:10px}
.qfoot .two .btn.ghost{width:auto;min-width:112px}

/* mikro animasyonlar: geri bildirim 100-200 ms, durum 200-320 ms, giriş ~500 ms. Yalnızca transform ve opacity. */
:root{--ease-out:cubic-bezier(.16,1,.3,1);--ease-q:cubic-bezier(.25,1,.5,1);--ease-in:cubic-bezier(.7,0,.84,0);--spring:cubic-bezier(.34,1.56,.64,1)}
.btn,.tile,.wide,.opt,.chip,.tab,.xbtn,.sw,.avbtn,.streak{transition:transform .2s var(--spring),box-shadow .2s var(--ease-q),background-color .2s var(--ease-q),border-color .2s var(--ease-q)}
@media (hover:hover){.tile:hover,.wide:hover{transform:translateY(-2px)}.btn:hover{transform:translateY(-1px)}.opt:hover:not([disabled]){border-color:var(--accent)}}
.btn:active,.opt:active,.chip:active,.tab:active,.xbtn:active,.sw:active,.avbtn:active{transform:scale(.96);transition-duration:.1s;transition-timing-function:var(--ease-q)}
.tile:active,.wide:active{transform:scale(.975);transition-duration:.1s;transition-timing-function:var(--ease-q)}
.view>*{animation-duration:.52s;animation-timing-function:var(--ease-out);animation-fill-mode:backwards}
.grid2>.tile,.stack>.wide{animation:rise .5s var(--ease-out) backwards;animation-delay:calc(var(--i,0)*60ms + 220ms)}
.rg circle:last-child{animation:ringin .9s var(--ease-out) .25s both}
@keyframes ringin{from{stroke-dashoffset:var(--full)}}
.bar i,.mb i,.dist i{transform-origin:left center;animation:grow .7s var(--ease-out) .2s both}
.q.ostep .ln i{transform-origin:left center;animation:grow .5s var(--ease-out) .15s both}
@keyframes grow{from{transform:scaleX(0)}}
.segs i.fresh{animation:segpop .4s var(--spring)}
@keyframes segpop{40%{transform:scaleY(2.2)}}
.gauge .needle{transition:transform 1.15s cubic-bezier(.2,1.1,.3,1)}
.q.enter .qcard,.q.enter .opt{animation:cardin .42s var(--ease-out) backwards}
.q.enter .opt{animation-delay:calc(var(--i,0)*45ms + 80ms)}
.q.enter.back .qcard,.q.enter.back .opt{animation-name:cardin-back}
@keyframes cardin{from{opacity:0;transform:translateX(18px)}}
@keyframes cardin-back{from{opacity:0;transform:translateX(-18px)}}
.q.ostep>*{animation:cardin .42s var(--ease-out) backwards;animation-delay:calc(var(--i,0)*50ms)}
.q.ostep.back>*{animation-name:cardin-back}
.q.ostep>.steps{animation:none}
.q.ostep>:nth-child(1){--i:0}.q.ostep>:nth-child(2){--i:1}.q.ostep>:nth-child(3){--i:2}.q.ostep>:nth-child(4){--i:3}.q.ostep>:nth-child(5){--i:4}.q.ostep>:nth-child(6){--i:5}.q.ostep>:nth-child(7){--i:6}.q.ostep>:nth-child(8){--i:7}
.opt.sel{animation:selpop .3s var(--spring)}
@keyframes selpop{0%{transform:scale(.97)}60%{transform:scale(1.015)}}
.opt.ok{animation:okpop .5s var(--spring)}
@keyframes okpop{0%{transform:scale(.97)}50%{transform:scale(1.025)}}
.opts:has(.opt.bad) .opt.ok{animation-delay:.3s;animation-fill-mode:backwards}
.opt.bad{animation:shake .36s var(--ease-q)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.opt .r .ico path,.sheet .sh .ico path,.rd .ico path{stroke-dasharray:60;stroke-dashoffset:60}
.opt.ok .r .ico path,.opt.bad .r .ico path,.sheet .sh .ico path,.opt.sel .rd .ico path{animation:draw .35s var(--ease-q) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sheet{animation-duration:.4s;animation-timing-function:var(--ease-out)}
.sheet .sh .ico{animation:icopop .4s var(--spring) .08s both}
@keyframes icopop{from{transform:scale(.5);opacity:0}}
.timer.low{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.streak .ico{animation:zap .6s var(--spring) .5s both}
@keyframes zap{from{transform:rotate(-18deg) scale(.6);opacity:.4}}
.tab[aria-current="page"] .ico{animation:tabpop .4s var(--spring)}
@keyframes tabpop{0%{transform:scale(.8)}}
.tab[aria-current="page"] span{animation:tabin .25s var(--ease-out) both}
@keyframes tabin{from{opacity:0;transform:translateX(-6px)}}
#quiz:not([hidden]),#onb:not([hidden]),#lb:not([hidden]),#pay:not([hidden]){animation:ovin .4s var(--ease-out) backwards}
#quiz.out,#lb.out,#pay.out{animation:ovout .23s var(--ease-in) both}
@keyframes ovin{from{opacity:0;transform:translateY(28px)}}
@keyframes ovout{to{opacity:0;transform:translateY(20px)}}
#avp .av{animation:keypop .2s var(--ease-q)}
@keyframes keypop{from{transform:scale(.9)}}
.sw.on{animation:selpop .3s var(--spring)}
.rev{animation:cardin .45s var(--ease-out) backwards;animation-delay:calc(var(--i,0)*60ms + .45s)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.01ms!important}.confetti{display:none}.btn::after{display:none}}
/* ---------- Stil katmanı: trafik levhası dili (halka motifi, dolu renk rozetleri, koyu gösterge paneli) ---------- */
/* sekme çubuğu: etiketler hep görünür */
.nav{padding:6px;gap:2px}
.tab{flex:1;flex-direction:column;justify-content:center;gap:3px;height:58px;padding:0 2px;font-size:11px;letter-spacing:.01em;border-radius:20px;position:relative}
.tab span{display:block}
.tab .ico{width:23px;height:23px;transition:transform .25s var(--spring)}
.tab[aria-current="page"]{background:none;box-shadow:none;color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;inset:2px 6px;border-radius:18px;background:var(--accent-soft);z-index:-1;animation:tabin .3s var(--ease-out)}
.tab[aria-current="page"] .ico{transform:translateY(-1px) scale(1.08);stroke-width:2.1}
@keyframes tabin{from{transform:scale(.7);opacity:0}}
.nav{isolation:isolate}
/* ana kadran kartı: iki temada da koyu gösterge paneli */
.hero{--fg:#F1F4FA;--muted:#A6B4CC;--dim:#64728C;--line:rgba(160,185,230,.16);--hi:rgba(255,255,255,.07);--track:#1F2B42;--face1:#1B2A48;--face2:#0A1122;
  --accent:#7CAEFF;--ok:#43D99A;--bad:#FF7B72;--warn:#FFBE55;--orb1:rgba(79,134,255,.42);--orb2:rgba(111,227,255,.16);--glow:rgba(79,134,255,.35);
  color:var(--fg);background:linear-gradient(165deg,#17264D 0%,#0C1530 55%,#080E1F 100%);border:1px solid rgba(140,175,255,.22);
  box-shadow:0 24px 48px -20px rgba(15,35,95,.55),inset 0 1px 0 rgba(255,255,255,.10)}
/* halka motifi: kartların köşesinde levha çemberi */
.tile,.wide,.qcard{isolation:isolate}
.wide{position:relative;overflow:hidden}
.tile::before,.wide::before{content:"";position:absolute;z-index:-1;border-radius:50%;border:16px solid var(--cs);pointer-events:none;transition:transform .5s var(--ease-out)}
.tile::before{width:124px;height:124px;right:-44px;bottom:-44px}
.wide::before{width:104px;height:104px;right:-34px;top:50%;margin-top:-52px;border-width:14px}
.tile:hover::before,.wide:hover::before{transform:scale(1.12)}
/* dolu renk ikon rozetleri */
.tbi{background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 72%,#102040));color:var(--accent-ink);box-shadow:0 6px 14px -4px var(--c),inset 0 1px 0 rgba(255,255,255,.35)}
.tbi .ico{stroke-width:2}
.dtile{background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 72%,#102040));color:var(--accent-ink);box-shadow:0 6px 14px -5px var(--c),inset 0 1px 0 rgba(255,255,255,.35)}
.ndot{border-radius:50%;border:2.5px solid var(--c);background:none}
.pc{font-weight:800}
/* bölüm başlıkları */
.sec .h2{display:flex;align-items:center;gap:10px}
.sec .h2:not(:has(.cattag))::before{content:"";width:5px;height:20px;border-radius:3px;background:linear-gradient(var(--g1),var(--g2));flex:none}
/* başlık vurgusu */
.h1{background:linear-gradient(100deg,var(--fg) 55%,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--fg);padding-bottom:.08em}
/* ana düğme */
.btn{min-height:58px;font-size:16.5px;border-radius:20px}
.btn.small{min-height:46px;font-size:14.5px;border-radius:15px}
.btn>.ico:last-child{width:26px;height:26px;padding:4px;border-radius:50%;background:rgba(255,255,255,.2)}
.btn.ghost{border:1.5px solid var(--line);background:var(--card)}
/* test şıkları */
.opt{border-radius:20px;min-height:66px}
.opt .L{border-radius:50%;width:38px;height:38px;background:none;border:2.5px solid var(--line);color:var(--fg);font-weight:800;transition:border-color .2s,background-color .2s,color .2s}
.opt:hover .L{border-color:var(--accent)}
.opt.sel .L{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok .L{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.opt.bad .L{background:var(--bad);border-color:var(--bad);color:var(--bg)}
.qn{-webkit-text-stroke:2px var(--c);color:transparent;opacity:.28}
/* kupa: dolu altın rozet, ikon rozetleri ile aynı dil */
.trbtn{position:relative;isolation:isolate;overflow:hidden;color:#3B2400;border:0;
  background:linear-gradient(145deg,#FFD978,#F2A92E 62%,#DD8F1C);
  box-shadow:0 8px 18px -6px rgba(242,169,46,.75),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 0 rgba(120,60,0,.18)}
.trbtn::before{content:"";position:absolute;z-index:-1;width:30px;height:30px;border-radius:50%;border:5px solid rgba(255,255,255,.28);right:-12px;top:-12px}
.trbtn .ico{stroke-width:2.1;fill:rgba(255,255,255,.35);transition:transform .35s var(--spring)}
.trbtn:hover .ico{transform:rotate(-8deg) scale(1.08)}
.trbtn:active .ico{transform:rotate(8deg) scale(.95)}
.trbtn::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);transform:translateX(-120%);animation:shine 4.5s ease-in-out 1.2s infinite}
@keyframes shine{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
/* ---------- Açılış akışı: uygulama diliyle (mavi vurgu, kart kenarı, halka motifi, dolu rozetler) ---------- */
#onb{background:radial-gradient(80% 380px at 15% -70px,var(--orb1),transparent 70%) no-repeat,radial-gradient(70% 320px at 95% -50px,var(--orb2),transparent 70%) no-repeat,var(--bg)}
.ow{--c:var(--accent);--cs:var(--accent-soft)}
.oback{border-radius:16px;background:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--hi)}
.oprog{height:6px}
.oprog i{background:linear-gradient(90deg,var(--g1),var(--g2));box-shadow:0 0 10px var(--glow)}
.ohead h1{background:linear-gradient(100deg,var(--fg) 55%,var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-bottom:.08em}
.co{position:relative;overflow:hidden;isolation:isolate;min-height:74px;border-radius:22px;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);
  transition:transform .2s var(--spring),border-color .2s var(--ease-q),box-shadow .25s var(--ease-q),background-color .2s var(--ease-q)}
.co::before{content:"";position:absolute;z-index:-1;width:96px;height:96px;border-radius:50%;border:13px solid var(--cs);right:-34px;top:50%;margin-top:-48px;opacity:.7;transition:transform .5s var(--ease-out),opacity .3s}
.co .cb{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 72%,#102040));color:var(--accent-ink);box-shadow:0 6px 14px -5px var(--c),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .3s var(--spring)}
.co .cb .ico{stroke-width:2}
.co small{color:var(--muted)}
.co.sel{background:linear-gradient(var(--cs),var(--cs)),var(--card);color:var(--fg);border-color:var(--c);box-shadow:0 0 0 4px var(--cs),var(--shadow);animation:selpop .32s var(--spring)}
.co.sel small{color:var(--muted);opacity:1}
.co.sel::before{transform:scale(1.25);opacity:1}
.co.sel .cb{transform:scale(1.06) rotate(-4deg)}
.co .rd{transition:background-color .2s,border-color .2s}
.co.sel .rd{background:var(--c);border-color:var(--c)}
.co.sel .rd .ico path{animation:draw .35s var(--ease-q) .1s forwards}
.co[disabled] .cb{filter:grayscale(.7)}
.ofoot{background:linear-gradient(transparent,var(--bg) 34%)}
.ohero,.ochart,.lchk,.psum div{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 var(--hi)}
.psum div{position:relative;overflow:hidden;isolation:isolate}
.psum div::before{content:"";position:absolute;z-index:-1;width:70px;height:70px;border-radius:50%;border:10px solid var(--accent-soft);right:-26px;bottom:-26px}
.psum b{color:var(--accent)}
.gbt{background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);color:var(--accent)}
.gval b{background:linear-gradient(160deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:bump .32s var(--spring)}
@keyframes bump{0%{transform:scale(.86)}60%{transform:scale(1.06)}}
.gtip b{color:var(--accent)}
.oload .lp{background:linear-gradient(160deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lchk li.on .ck{background:var(--ok);border-color:var(--ok);animation:selpop .3s var(--spring)}
.lchk li.on .ck .ico{color:var(--bg)}
.obadge{background:linear-gradient(145deg,var(--btn1),var(--btn2));color:#fff;box-shadow:0 12px 26px -6px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.pfirst{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;box-shadow:0 14px 30px -10px var(--glow),inset 0 1px 0 rgba(255,255,255,.3)}
.pfirst>.ico{width:40px;height:40px;padding:9px;border-radius:50%;background:rgba(255,255,255,.2)}
#onb .field{background:var(--card);border:1.5px solid var(--line);box-shadow:inset 0 1px 0 var(--hi)}
#onb .field:focus{border-color:var(--accent)}
#avp .av{animation:bump .35s var(--spring);box-shadow:0 14px 30px -10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3)}
/* ---------- PRO ve 7 günlük deneme ---------- */
#pay{z-index:70}
.locked::after{content:"PRO";position:absolute;top:10px;right:10px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.07em;background:linear-gradient(135deg,#FFD978,#F2A92E);color:#3B2400;box-shadow:0 4px 10px -3px rgba(242,169,46,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.setrow.locked::after{top:6px;left:8px;right:auto}
.locked .cnts{opacity:.35}
.trial{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:22px;color:#3B2400;
  background:linear-gradient(135deg,#FFE08A,#F6B341 60%,#E99A22);box-shadow:0 14px 30px -14px rgba(242,169,46,.8),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .2s var(--spring)}
.trial:active{transform:scale(.98)}
.trial::before{content:"";position:absolute;z-index:-1;width:110px;height:110px;border-radius:50%;border:15px solid rgba(255,255,255,.25);right:-36px;top:50%;margin-top:-55px}
.trial b{display:block;font-family:var(--display);font-size:16.5px;letter-spacing:-.015em}
.trial small{font-size:13px;font-weight:600;opacity:.8}
.trial .cr{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;flex:none}
.trial.end{background:linear-gradient(135deg,var(--btn1),var(--btn2));color:#fff;box-shadow:0 14px 30px -14px var(--glow),inset 0 1px 0 rgba(255,255,255,.3)}
.trial.end .cr{background:rgba(255,255,255,.2)}
.tdays{display:flex;gap:6px;margin-top:12px}
.tdays i{flex:1;height:7px;border-radius:4px;background:var(--track)}
.tdays i.on{background:linear-gradient(90deg,#FFD978,#F2A92E);animation:grow .5s var(--ease-out) backwards;animation-delay:calc(var(--i)*50ms + 150ms);transform-origin:left}
.pben{display:flex;flex-direction:column;gap:14px}
.pben li{display:flex;align-items:center;gap:14px;animation:rise .45s var(--ease-out) backwards;animation-delay:calc(var(--i)*60ms + 120ms)}
.pben .tbi{position:static;flex:none}
.pben b{display:block;font-family:var(--display);font-size:16px;letter-spacing:-.01em}
.pben small{color:var(--muted);font-size:13.5px}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:12px}
.plan{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:20px 6px 16px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);min-width:0;
  transition:transform .2s var(--spring),border-color .2s,box-shadow .25s}
.plan:active{transform:scale(.96)}
.plan b{font-family:var(--display);font-size:15.5px;letter-spacing:-.01em}
.plan small{font-size:12px;color:var(--muted);line-height:1.3}
.plan .pr{font-family:var(--display);font-weight:800;font-size:17px;margin-top:8px}
.plan .tg{position:absolute;top:-11px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;background:linear-gradient(135deg,#FFD978,#F2A92E);color:#3B2400}
.plan.sel{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--card);box-shadow:0 0 0 4px var(--accent-soft),var(--shadow);animation:selpop .3s var(--spring)}
.plan.sel .pr{color:var(--accent)}
.paymsg{padding:14px 16px;border-radius:18px;background:var(--accent-soft);border:1px solid var(--line);font-size:14.5px;animation:slide .32s var(--ease-out) both}
.ptools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ptools button{font-size:13px;font-weight:600;color:var(--muted);padding:8px 12px;border-radius:12px;border:1px dashed var(--line)}

img.mark{display:block;object-fit:cover;background:none;box-shadow:0 8px 20px rgba(0,0,0,.18),0 0 0 1px var(--line);border-radius:10px}

/* ---- akıcılık ---- */
html{overscroll-behavior-x:none}
button,a,.card,.tab{touch-action:manipulation}
#view{touch-action:pan-y;will-change:auto;contain:layout style}
.strip{touch-action:pan-x pan-y;overscroll-behavior-x:contain}
.view.tn>*{animation:none!important}
.streak,.sheet{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.tab{transition:background .2s,color .2s,transform .15s}
.tab:active{transform:scale(.94)}
.hero::before,.hero::after{transform:translateZ(0)}
body.swp{user-select:none;-webkit-user-select:none}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 4px;text-align:left;border-radius:14px;width:100%}
.setrow .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.setrow .tbi{position:static;width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);box-shadow:none;flex:none}
.setrow .tbi svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.setrow{padding:8px 4px}
.setrow small{color:var(--muted);font-size:12.5px;font-weight:500}
.tgl{width:46px;height:28px;border-radius:99px;background:var(--raise);position:relative;flex:none;transition:background .25s;box-shadow:inset 0 0 0 1px var(--line)}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.setrow[aria-checked="true"] .tgl{background:linear-gradient(135deg,var(--btn1),var(--btn2))}
.setrow[aria-checked="true"] .tgl::after{transform:translateX(18px)}

.star{width:1em;height:1em;vertical-align:-.14em;flex:none;margin-left:.22em}
.spill{position:relative;display:flex;align-items:center;gap:2px;padding:8px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-family:var(--display);font-weight:800;font-size:16px;flex:none;font-variant-numeric:tabular-nums}
.spill .star{width:20px;height:20px;margin:0 0 0 4px;order:2}
.spill.bump .star{animation:starpop .6s cubic-bezier(.2,.9,.3,1.4)}
.spill.bump{animation:pillglow .8s ease-out}
.spill .plus{position:absolute;right:6px;top:100%;margin-top:2px;color:#E39A1C;font-size:15px;font-weight:800;pointer-events:none;animation:plusup 1s cubic-bezier(.2,.8,.2,1) forwards;text-shadow:0 1px 8px rgba(247,183,49,.5)}
@keyframes starpop{0%{transform:scale(.6) rotate(-30deg)}55%{transform:scale(1.5) rotate(14deg)}100%{transform:none}}
@keyframes pillglow{0%{box-shadow:0 0 0 0 rgba(247,183,49,.7)}100%{box-shadow:0 0 0 14px rgba(247,183,49,0)}}
@keyframes plusup{0%{opacity:0;transform:translateY(8px) scale(.7)}25%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-26px)}}
.earn{display:inline-flex;align-items:center;gap:6px;margin:12px auto 0;padding:9px 16px;border-radius:99px;background:rgba(247,183,49,.16);border:1px solid rgba(247,183,49,.45);font-weight:700;font-size:14.5px}
.earn .star{width:20px;height:20px;margin:0;animation:starpop .7s .3s cubic-bezier(.2,.9,.3,1.4) backwards}
.earn b{font-family:var(--display);font-size:17px;color:#D98E10}
.hero>div[style*="text-align:center"]{display:flex;flex-direction:column;align-items:center}
.pt .star,.lbrow .pt .star,.big .star,.you .star{width:.85em;height:.85em}

.fly{position:fixed;left:0;top:0;width:26px;height:26px;z-index:300;pointer-events:none;will-change:transform,opacity}
.fly .star{width:100%;height:100%;margin:0;display:block}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.qtext{font-size:calc(23px*var(--qs,1))}
.opt .t{font-size:calc(1em*var(--qs,1))}
.bgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px}
.bdg{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.bdg b{font-size:12.5px;line-height:1.2}
.bdg small{font-size:11px;line-height:1.25;color:var(--muted)}
.bico{position:relative;width:56px;height:56px;border-radius:19px;display:flex;align-items:center;justify-content:center;background:var(--raise);color:var(--dim)}
.bico>svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.bdg.on .bico{background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 70%,#101a30));color:#fff;box-shadow:0 8px 18px -6px var(--c),inset 0 1px 0 rgba(255,255,255,.4)}
.bdg.on .bico>svg{opacity:1}
.bdg:not(.on) b{color:var(--muted)}
.bico .lk{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.bico .lk svg{width:12px;height:12px;fill:none;stroke:var(--muted);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:1}
.frz{display:flex;align-items:center;gap:12px}
.frz .grow{display:flex;flex-direction:column;gap:3px;min-width:0}
.frz small{color:var(--muted);font-size:12.5px;font-weight:500;line-height:1.35}
.frz .tbi{position:static;flex:none;--c:#3B82F6}
.frz .btn.small{flex:none;white-space:nowrap}
.frz .star{width:14px;height:14px;margin-left:3px}

.hfi{width:42px;height:42px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 70%,#101a30));box-shadow:0 8px 16px -8px var(--c),inset 0 1px 0 rgba(255,255,255,.35)}

.hfeat b{font-size:15px}.hfeat small{font-size:13px;color:var(--muted);line-height:1.3}

@keyframes hfloat{50%{transform:translate3d(0,-7px,0)}}

#splash img{width:96px;height:96px;border-radius:25px;box-shadow:0 18px 40px rgba(0,0,0,.28),0 0 0 1px var(--line);animation:spin-in .6s cubic-bezier(.2,.8,.2,1) both,breathe 1.6s ease-in-out .6s infinite}

<script>
(function(){
"use strict";
/* ---------- Soru bankası (doğru cevap her zaman ilk seçenek; testte karıştırılır) ---------- */
var BANK=[
{id:"t1",k:"trafik",q:"Yerleşim yeri dışında, bölünmemiş yolda otomobiller için azami hız sınırı kaç km/saattir?",o:["90","70","110","120"],e:"Otomobiller için yerleşim yeri dışındaki bölünmemiş yollarda genel sınır 90 km/saattir. Bölünmüş yollarda 110 km/saattir. Otoyollarda KGM işletimindeki kesimlerde genel sınır 130, YİD otoyollarında 140 km/saattir; trafik işaretleri esas alınır."},
{id:"t2",k:"trafik",q:"Yerleşim yerleri içinde otomobiller için azami hız sınırı kaç km/saattir?",o:["50","30","60","70"],e:"Aksine bir işaret yoksa yerleşim yeri içinde otomobiller için sınır 50 km/saattir."},
{id:"t3",k:"trafik",q:"KGM tarafından işletilen otoyollarda otomobiller için, aksine işaret yoksa genel azami hız sınırı kaç km/saattir?",o:["130","120","110","140"],e:"KGM tarafından işletilen otoyollarda otomobiller için genel sınır 130 km/saattir. Yap-İşlet-Devret otoyollarında 140 km/saate kadar uygulanabilir; yoldaki trafik işaretleri esas alınır."},
{id:"t4",k:"trafik",q:"Dairesel biçimli, kırmızı çerçeveli levhalar hangi grup trafik işaretidir?",o:["Yasaklama ve kısıtlama","Tehlike uyarı","Mecburi yön","Bilgi"],e:"Kırmızı çerçeveli daire yasak veya kısıtlama bildirir. Tehlike uyarı levhaları kırmızı çerçeveli üçgendir, mavi daireler ise mecburiyet bildirir."},
{id:"t5",k:"trafik",q:"Sekizgen biçimli kırmızı levha neyi belirtir?",o:["Dur","Yol ver","Park yasağı","Girilmez"],e:"Sekizgen levha DUR levhasıdır. Araç tam olarak durur ve kavşaktaki geçiş hakkı olanlara yol verir. Yol ver levhası ters üçgendir."},
{id:"t6",k:"trafik",q:"Işıklı işaret, trafik görevlisi ve levha bulunmayan eşit yollar kavşağında hangi araç önce geçer?",o:["Sağdan gelen araç","Soldan gelen araç","Hızlı olan araç","Büyük olan araç"],e:"Eşit derecedeki yolların kesiştiği kavşakta sağdan gelen araç öncelikli geçer."},
{id:"t7",k:"trafik",q:"Dönel kavşaklarda, aksine bir işaret yoksa geçiş önceliği kimdedir?",o:["Kavşak içinde dönmekte olan araçlarda","Kavşağa girmek üzere olan araçlarda","Hızlı gelen araçlarda","Ticari araçlarda"],e:"Dönel kavşakta, aksine bir işaret yoksa kavşak içindeki araçlar önceliklidir. Kavşağa girmek isteyen araç yol verir."},
{id:"t8",k:"trafik",q:"Aşağıdaki yerlerden hangisinde öndeki aracı geçmek yasaktır?",o:["Tepe üstlerinde ve görüşün kısıtlı olduğu virajlarda","Yolun görüşün açık olduğu düz bölümünde","Bölünmüş yolun boş şeridinde","Tek yönlü geniş yolda"],e:"Karşıdan gelen aracı göremediğiniz tepe üstlerinde ve virajlarda geçmek çok tehlikelidir ve yasaktır."},
{id:"t9",k:"trafik",q:"Takip mesafesi için kullanılan genel kural hangisidir?",o:["Hızın yarısı kadar metre bırakmak","Hızın iki katı kadar metre bırakmak","Her zaman 10 metre bırakmak","Bir araç boyu bırakmak"],e:"Pratik kuralla takip mesafesi, km/saat cinsinden hızın yarısı kadar metredir. 80 km/saatte yaklaşık 40 metre. Yağmurlu veya kaygan yolda daha fazlası gerekir."},
{id:"t10",k:"trafik",q:"Yaya geçidine yaklaşırken bir yaya geçmekteyse sürücü ne yapmalıdır?",o:["Yavaşlayıp gerekirse durarak yayaya yol vermelidir","Korna çalarak yayayı uyarmalıdır","Hızını koruyarak geçmelidir","Yayanın önünden hızlıca geçmelidir"],e:"Yaya geçidinde yayalar önceliklidir. Sürücü yavaşlar ve gerekirse durur."},
{id:"t11",k:"trafik",q:"Trafik ışığı kırmızı yanıyorsa sürücü ne yapmalıdır?",o:["Dur çizgisinin gerisinde durmalıdır","Yavaşlayarak geçmelidir","Yaya yoksa geçmelidir","Her koşulda sağa dönmelidir"],e:"Kırmızı ışıkta araç dur çizgisinin gerisinde durur ve yeşil ışık yanana kadar bekler."},
{id:"t12",k:"trafik",q:"Özel otomobil sürücüleri için kanda izin verilen azami alkol miktarı nedir?",o:["0,50 promil","0,20 promil","1,00 promil","Sınır yoktur"],e:"Özel otomobillerde sınır 0,50 promildir. Ticari araçlarda sınır daha düşüktür. Emin olmanın yolu hiç alkol almamaktır."},
{id:"t13",k:"trafik",q:"Emniyet kemeri kullanımı hakkında hangisi doğrudur?",o:["Kemerli koltuklarda oturan herkes için zorunludur","Yalnızca sürücü için zorunludur","Yalnızca şehir dışında zorunludur","Yalnızca ön koltuk yolcuları için zorunludur"],e:"Sürücü ve araçtaki tüm yolcular, kemer bulunan koltuklarda kemer takmak zorundadır."},
{id:"t14",k:"trafik",q:"Siren çalarak yaklaşan bir ambulansı fark eden sürücü ne yapmalıdır?",o:["Sağa yanaşıp yavaşlayarak veya durarak yol vermelidir","Hızını artırıp önünden çekilmelidir","Aynı hızla yoluna devam etmelidir","Ambulansın hemen arkasından gitmelidir"],e:"Acil durum araçlarına yol vermek zorunludur. Sağa yanaşıp yavaşlar, gerekirse durursunuz."},
{id:"t15",k:"trafik",q:"Yakıt tüketimini ve egzoz emisyonunu azaltmak için hangisi doğrudur?",o:["Lastik basıncını önerilen değerde tutmak","Araçta gereksiz yük taşımak","Ani hızlanıp ani fren yapmak","Motoru beklerken boşta çalıştırmak"],e:"Düşük lastik basıncı yuvarlanma direncini artırır ve yakıt tüketimini yükseltir. Diğer seçenekler de tüketimi ve emisyonu artırır."},
{id:"t16",k:"trafik",q:"B sınıfı sürücü belgesi hangi araçları kullanma hakkı verir?",o:["Otomobil ve azami toplam ağırlığı 3500 kg'ı geçmeyen kamyonetler","Yalnızca otomobiller","Otobüsler","Motosikletler"],e:"B sınıfı belge otomobil ve azami toplam ağırlığı 3500 kg'ı geçmeyen kamyonet kullanma hakkı verir."},

{id:"y1",k:"ilkyardim",q:"Türkiye'de acil yardım çağrısı için hangi numara aranır?",o:["112","110","155","118"],e:"112 Acil Çağrı Merkezi ambulans, itfaiye ve polis dahil tüm acil durumlar için aranır."},
{id:"y2",k:"ilkyardim",q:"Kaza yerine ilk ulaşan kişi önce ne yapmalıdır?",o:["Ortamın güvenli olduğundan emin olup 112'yi aramalıdır","Yaralıları hemen araçtan çıkarmalıdır","Yaralılara su içirmelidir","Olay yerinden uzaklaşmalıdır"],e:"Önce kendinizin ve yaralının güvenliği sağlanır, ardından yardım çağrılır. Zorunlu olmadıkça yaralı hareket ettirilmez."},
{id:"y3",k:"ilkyardim",q:"Yetişkinde temel yaşam desteğinde göğüs basısı ve soluk oranı nedir?",o:["30 basıyı 2 soluk izler","15 basıyı 1 soluk izler","5 basıyı 1 soluk izler","2 basıyı 30 soluk izler"],e:"Yetişkinde 30 göğüs basısı ve ardından 2 soluk verilir. Basılar dakikada 100-120 hızında, yaklaşık 5-6 cm derinlikte yapılır."},
{id:"y4",k:"ilkyardim",q:"Dışarıya doğru şiddetli kanaması olan bir yarada ilk yapılacak müdahale nedir?",o:["Temiz bir bezle yaraya doğrudan baskı uygulamak","Yaraya diş macunu sürmek","Yaralıya su içirmek","Yarayı açık bırakıp beklemek"],e:"Kanamayı durdurmanın ilk yolu, temiz bir bezle yaraya doğrudan baskı uygulamaktır."},
{id:"y5",k:"ilkyardim",q:"Burun kanaması olan kişiye nasıl yardım edilir?",o:["Oturtulup başı hafifçe öne eğilir, burun kanatları sıkılır","Başı geriye atılarak yatırılır","Burnuna pamuk tıkanıp bırakılır","Soğuk su içirilir"],e:"Baş geriye atılmaz. Kan yutulursa mide bulantısı ve kusma olabilir."},
{id:"y6",k:"ilkyardim",q:"Hafif yanıklarda ilk müdahale hangisidir?",o:["Yanık bölgeyi akan musluk suyunda soğutmak","Yanığa buz koymak","Kabarcıkları patlatmak","Yanığa yağ veya diş macunu sürmek"],e:"Yanık yeri akan serin suda soğutulur. Buz doku hasarını artırır, kabarcıklar patlatılmaz, yağ ve macun sürülmez."},
{id:"y7",k:"ilkyardim",q:"Kırık şüphesinde doğru yaklaşım hangisidir?",o:["Bölgeyi hareket ettirmeden sabitlemek","Kırığı yerine oturtmaya çalışmak","Yaralıyı yürütmek","Bölgeye masaj yapmak"],e:"Kırık bölge oynatılmadan sabitlenir. Yerine oturtmaya çalışmak damar ve sinir hasarına yol açabilir."},
{id:"y8",k:"ilkyardim",q:"Bilinci kapalı ama soluk alıp veren kazazedeye hangi pozisyon verilir?",o:["Yan yatış (koma) pozisyonu","Sırtüstü, başı yukarıda","Yüzüstü","Oturur pozisyon"],e:"Yan yatış pozisyonu hava yolunu açık tutar. Dil geriye kaçmaz, kusmuk solunum yoluna gitmez."},
{id:"y9",k:"ilkyardim",q:"Aşağıdakilerden hangisi şok belirtisidir?",o:["Soluk, soğuk ve nemli cilt ile hızlı, zayıf nabız","Kızarık, sıcak cilt ve yavaş nabız","Normal cilt rengi ve nabız","Yüksek ateş ve iştah artışı"],e:"Şokta cilt soluk, soğuk ve nemli olur. Nabız hızlı ve zayıf hale gelir."},
{id:"y10",k:"ilkyardim",q:"Motosiklet kazasında yaralının kaskı hakkında doğru olan hangisidir?",o:["Zorunlu olmadıkça, örneğin solunum durmadıkça çıkarılmaz","Her durumda hemen çıkarılır","Kask çıkarılıp yaralı oturtulur","Kask çıkarılıp su verilir"],e:"Kask omurga yaralanması riski nedeniyle gereksiz yere çıkarılmaz. Solunum yoksa hava yolunu açmak için çıkarmak gerekir."},
{id:"y11",k:"ilkyardim",q:"Yetişkinde yabancı cisim tıkanıklığında öksüremeyen kişiye ne yapılır?",o:["Sırta vurulur, gerekirse karına yukarı doğru baskı uygulanır (Heimlich)","Su içirilir","Yatırılıp beklenir","Boğazına parmak sokulur"],e:"Tam tıkanıklıkta önce sırta vurulur, sonuç alınmazsa karına yukarı doğru baskı (Heimlich) uygulanır."},
{id:"y12",k:"ilkyardim",q:"İlk yardımın temel amaçlarından biri hangisidir?",o:["Hayatı korumak ve durumun kötüleşmesini önlemek","Kesin teşhis koymak","İlaç tedavisi başlatmak","Ameliyat yapmak"],e:"İlk yardım; hayatı korumak, durumun kötüleşmesini önlemek ve iyileşmeyi kolaylaştırmak içindir. Teşhis ve tedavi sağlık personeline aittir."},

{id:"m1",k:"motor",q:"Motor yağının temel görevi nedir?",o:["Hareketli parçalar arasındaki sürtünmeyi azaltmak","Yakıtı depolamak","Aküyü şarj etmek","Egzoz gazını soğutmak"],e:"Yağ sürtünmeyi ve aşınmayı azaltır. Ayrıca ısıyı taşır, parçaları temizler ve korur."},
{id:"m2",k:"motor",q:"Soğutma suyuna antifriz karıştırmanın amacı nedir?",o:["Donmayı ve paslanmayı önlemek, kaynama noktasını yükseltmek","Yakıtı ucuzlatmak","Yağı akıcı yapmak","Lastikleri korumak"],e:"Antifriz soğutma suyunun donmasını engeller, kaynama noktasını yükseltir ve korozyonu azaltır."},
{id:"m3",k:"motor",q:"Sürüş sırasında yağ basıncı ikaz lambası yanarsa ne yapılmalıdır?",o:["Güvenli yere çekilip motoru durdurmak","Aynı hızla devam etmek","Hızlanıp yağı ısıtmak","Lambayı yok saymak"],e:"Yağ basıncı düşükse motor parçaları kısa sürede zarar görür. Güvenli bir yerde durup motor kapatılır."},
{id:"m4",k:"motor",q:"Otomobil lastiklerinde diş derinliği en az kaç mm olmalıdır?",o:["1,6 mm","0,5 mm","3 mm","5 mm"],e:"Otomobil lastiklerinde yasal asgari diş derinliği 1,6 mm'dir. Islak zeminde tutuş bu değerin altında hızla düşer."},
{id:"m5",k:"motor",q:"ABS sisteminin görevi nedir?",o:["Ani frenlemede tekerleklerin kilitlenmesini önleyip direksiyon kontrolünü korumak","Yakıt tüketimini azaltmak","Motoru soğutmak","Vitesi otomatik değiştirmek"],e:"ABS, ani frenlemede tekerlerin kilitlenmesini engeller. Böylece fren sırasında aracı yönlendirebilirsiniz."},
{id:"m6",k:"motor",q:"Debriyaj pedalının görevi nedir?",o:["Motorla şanzıman arasındaki güç iletimini kesip bağlamak","Aracı yavaşlatmak","Yakıt basıncını artırmak","Farları açmak"],e:"Debriyaj motor ile şanzıman arasındaki bağlantıyı kurar ve keser. Vites değiştirirken ve kalkışta kullanılır."},
